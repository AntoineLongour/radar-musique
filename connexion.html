<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ton compte · Platine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Couleurs et polices (les mêmes que les autres pages) ---------- */
    :root {
      --fond: #eef0f3;
      --carte: #ffffff;
      --texte: #15161a;
      --discret: #646a75;
      --trait: #d9dde3;
      --accent: #3b3bf0;
      --erreur: #c62828;
      --succes: #1b7a3d;
      --titre: "Big Shoulders Display", "Arial Narrow", sans-serif;
      --corps: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #0f1013;
        --carte: #1a1c21;
        --texte: #eceef1;
        --discret: #9298a3;
        --trait: #2b2e35;
        --accent: #8d8cff;
        --erreur: #ff7b72;
        --succes: #6fd08c;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }   /* un élément caché reste caché, même avec display: grid */
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: var(--corps);
      font-size: 15px;
      line-height: 1.5;
    }
    .page { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }

    /* ---------- Onglets ---------- */
    .onglets { display: flex; flex-wrap: wrap; gap: 22px; margin-bottom: 32px; }
    .onglets a {
      font: 500 12px var(--mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--discret);
      text-decoration: none;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }
    .onglets a:hover { color: var(--texte); }
    .onglets a[aria-current="page"] { color: var(--texte); border-bottom-color: var(--accent); }

    /* ---------- En-tête ---------- */
    header { display: grid; gap: 6px; margin-bottom: 28px; }
    .sur-titre {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--discret);
      margin: 0;
    }
    h1 {
      font-family: var(--titre);
      font-weight: 900;
      font-size: clamp(44px, 9vw, 88px);
      line-height: 0.9;
      margin: 0;
      text-transform: uppercase;
    }
    h1 span { color: var(--accent); }
    .resume { color: var(--discret); margin: 6px 0 0; max-width: 520px; }

    /* ---------- Panneau du formulaire ---------- */
    .panneau {
      max-width: 440px;
      background: var(--carte);
      border: 1.5px solid var(--trait);
      border-radius: 10px;
      padding: 24px 22px;
    }
    .choix { display: flex; gap: 8px; margin-bottom: 22px; }
    .choix button {
      flex: 1;
      font: 600 14px var(--corps);
      color: var(--texte);
      background: transparent;
      border: 1.5px solid var(--trait);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
    }
    .choix button:hover { border-color: var(--texte); }
    .choix button[aria-pressed="true"] { background: var(--texte); border-color: var(--texte); color: var(--fond); }

    form { display: grid; gap: 16px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input {
      font: 400 16px var(--corps);   /* 16px : évite le zoom automatique sur iPhone */
      color: var(--texte);
      background: var(--fond);
      border: 1.5px solid var(--trait);
      border-radius: 6px;
      padding: 10px 12px;
      width: 100%;
    }
    input:hover { border-color: var(--discret); }
    .aide { margin: -8px 0 0; font-size: 13px; color: var(--discret); }

    .bouton, button[type="submit"] {
      display: inline-block;
      font: 600 15px var(--corps);
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
    }
    @media (prefers-color-scheme: dark) {
      .bouton, button[type="submit"] { color: #0f1013; }
    }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
    .bouton.secondaire { background: transparent; color: var(--texte); border-color: var(--trait); }
    .bouton.secondaire:hover { border-color: var(--texte); }

    #message { margin: 0; min-height: 1.5em; font-size: 14px; }
    #message.erreur { color: var(--erreur); }
    #message.succes { color: var(--succes); }

    .pseudo {
      font-family: var(--titre);
      font-weight: 900;
      font-size: 44px;
      line-height: 1;
      margin: 6px 0 20px;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }

    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="page">
    <nav class="onglets" aria-label="Pages du site">
      <a href="index.html">Radar</a>
      <a href="wrapped.html">Ma semaine</a>
      <a href="connexion.html" aria-current="page">Compte</a>
    </nav>

    <header>
      <p class="sur-titre">Platine</p>
      <h1>Ton <span>compte</span></h1>
      <p class="resume">Un pseudo et un mot de passe suffisent. Chacun ne voit que ses écoutes et ses cartes.</p>
    </header>

    <main>
      <!-- Formulaire : connexion ou création de compte -->
      <section class="panneau" id="formulaire" hidden>
        <div class="choix" id="choix">
          <button type="button" data-mode="connexion" aria-pressed="true">Se connecter</button>
          <button type="button" data-mode="creation" aria-pressed="false">Créer un compte</button>
        </div>

        <form id="form" novalidate>
          <label>Pseudo
            <input id="pseudo" name="pseudo" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
          </label>
          <p class="aide" id="aide-pseudo" hidden>3 à 20 caractères : lettres sans accent, chiffres, _ ou -. C'est le nom affiché sur tes cartes («&nbsp;Découverte par&nbsp;»).</p>

          <label>Mot de passe
            <input id="mdp" name="mdp" type="password" autocomplete="current-password" required>
          </label>

          <label id="bloc-confirmation" hidden>Confirme le mot de passe
            <input id="mdp2" name="mdp2" type="password" autocomplete="new-password">
          </label>

          <button type="submit" id="valider">Se connecter</button>
          <p id="message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- Affiché quand on est connecté -->
      <section class="panneau" id="connecte" hidden>
        <p class="sur-titre">Connecté en tant que</p>
        <p class="pseudo" id="nom"></p>
        <div class="actions">
          <a class="bouton" href="index.html">Aller au site</a>
          <button type="button" class="bouton secondaire" id="deconnexion">Se déconnecter</button>
        </div>
      </section>
    </main>
  </div>

  <!-- La bibliothèque Supabase, puis nos réglages de connexion -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="compte.js"></script>
  <script>
    let mode = "connexion";   // ou "creation"

    const formulaire = document.getElementById("formulaire");
    const connecte = document.getElementById("connecte");
    const message = document.getElementById("message");
    const valider = document.getElementById("valider");
    const champPseudo = document.getElementById("pseudo");
    const champMdp = document.getElementById("mdp");
    const champMdp2 = document.getElementById("mdp2");

    function afficherMessage(texte, type) {
      message.textContent = texte;
      message.className = type || "";
    }

    // Affiche le formulaire, ou le pseudo si quelqu'un est connecté
    async function afficher() {
      const joueur = await joueurConnecte();
      formulaire.hidden = Boolean(joueur);
      connecte.hidden = !joueur;
      if (joueur) document.getElementById("nom").textContent = joueur.pseudo;
    }

    // Bascule entre « Se connecter » et « Créer un compte »
    document.getElementById("choix").addEventListener("click", (evenement) => {
      const bouton = evenement.target.closest("button");
      if (!bouton) return;
      mode = bouton.dataset.mode;
      document.querySelectorAll("#choix button").forEach(b => b.setAttribute("aria-pressed", b === bouton));
      const creation = mode === "creation";
      document.getElementById("aide-pseudo").hidden = !creation;
      document.getElementById("bloc-confirmation").hidden = !creation;
      champMdp.autocomplete = creation ? "new-password" : "current-password";
      valider.textContent = creation ? "Créer mon compte" : "Se connecter";
      afficherMessage("");
    });

    document.getElementById("form").addEventListener("submit", async (evenement) => {
      evenement.preventDefault();
      const pseudo = champPseudo.value.trim();
      const motDePasse = champMdp.value;

      // Vérifications avant d'appeler Supabase
      if (!FORMAT_PSEUDO.test(pseudo)) {
        afficherMessage("Pseudo : 3 à 20 caractères, lettres sans accent, chiffres, _ ou -.", "erreur");
        champPseudo.focus();
        return;
      }
      if (mode === "creation") {
        if (motDePasse.length < MOT_DE_PASSE_MINIMUM) {
          afficherMessage(`Mot de passe : au moins ${MOT_DE_PASSE_MINIMUM} caractères.`, "erreur");
          champMdp.focus();
          return;
        }
        if (motDePasse !== champMdp2.value) {
          afficherMessage("Les deux mots de passe ne sont pas identiques.", "erreur");
          champMdp2.focus();
          return;
        }
      } else if (!motDePasse) {
        afficherMessage("Entre ton mot de passe.", "erreur");
        champMdp.focus();
        return;
      }

      valider.disabled = true;
      afficherMessage(mode === "creation" ? "Création du compte…" : "Connexion…");
      try {
        if (mode === "creation") await creerCompte(pseudo, motDePasse);
        else await seConnecter(pseudo, motDePasse);
        afficherMessage("");
        champMdp.value = champMdp2.value = "";
        await afficher();
      } catch (erreur) {
        afficherMessage(messageErreur(erreur), "erreur");
      } finally {
        valider.disabled = false;
      }
    });

    document.getElementById("deconnexion").addEventListener("click", async () => {
      await seDeconnecter();
      await afficher();
    });

    // Au chargement : vérifie que compte.js est rempli, puis affiche la bonne partie
    if (SUPABASE_CLE_PUBLIQUE.startsWith("sb_secret_")) {
      formulaire.hidden = false;
      valider.disabled = true;
      afficherMessage("compte.js contient la clé SECRÈTE ! Remplace-la par la clé publique (sb_publishable_…), puis change la clé secrète dans Supabase.", "erreur");
    } else if (SUPABASE_URL.includes("TON-PROJET") || SUPABASE_CLE_PUBLIQUE.includes("TA-CLE")) {
      formulaire.hidden = false;
      valider.disabled = true;
      afficherMessage("Il manque l'adresse du projet et la clé publique dans compte.js.", "erreur");
    } else {
      afficher().catch(erreur => {
        formulaire.hidden = false;
        afficherMessage(messageErreur(erreur), "erreur");
      });
    }
  </script>
</body>
</html>
