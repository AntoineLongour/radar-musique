<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar du vendredi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ---------- Couleurs et polices (mode clair, puis mode sombre) ---------- */
    :root {
      --fond: #eef0f3;
      --carte: #ffffff;
      --texte: #15161a;
      --discret: #646a75;
      --trait: #d9dde3;
      --accent: #3b3bf0;
      --sticker: #ffd84d;
      --sticker-texte: #15161a;
      --titre: "Big Shoulders Display", "Arial Narrow", sans-serif;
      --corps: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fond: #0f1013;
        --carte: #1a1c21;
        --texte: #eceef1;
        --discret: #9298a3;
        --trait: #2b2e35;
        --accent: #8d8cff;
        --sticker: #ffd84d;
        --sticker-texte: #15161a;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: var(--corps);
      font-size: 15px;
      line-height: 1.5;
    }
    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    /* ---------- En-tête ---------- */
    header { display: grid; gap: 6px; margin-bottom: 28px; }
    .sur-titre {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--discret);
    }
    h1 {
      font-family: var(--titre);
      font-weight: 900;
      font-size: clamp(44px, 9vw, 88px);
      line-height: 0.9;
      margin: 0;
      text-transform: uppercase;
    }
    h1 span { color: var(--accent); }
    .resume { color: var(--discret); margin: 6px 0 0; }

    /* ---------- Filtres ---------- */
    .filtres { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 32px; }
    .filtres button {
      font: 600 14px var(--corps);
      color: var(--texte);
      background: transparent;
      border: 1.5px solid var(--trait);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .filtres button:hover { border-color: var(--texte); }
    .filtres button[aria-pressed="true"] {
      background: var(--texte);
      border-color: var(--texte);
      color: var(--fond);
    }
    .filtres button:focus-visible, .carte:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ---------- Sections par jour ---------- */
    section { margin-bottom: 40px; }
    h2 {
      font-family: var(--titre);
      font-weight: 700;
      font-size: 28px;
      text-transform: uppercase;
      line-height: 1.1;
      margin: 0 0 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      column-gap: 12px;
      border-bottom: 1.5px solid var(--trait);
      padding-bottom: 6px;
    }
    h2 .compte { font-family: var(--mono); font-size: 13px; color: var(--discret); font-weight: 500; white-space: nowrap; }
    .grille {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px;
    }

    /* ---------- Cartes ---------- */
    .carte {
      display: grid;
      gap: 8px;
      align-content: start;
      color: inherit;
      text-decoration: none;
      min-width: 0;
    }
    .pochette {
      position: relative;
      aspect-ratio: 1;
      max-width: 100%;
      border-radius: 6px;
      overflow: hidden;
      background: var(--trait);
    }
    .pochette img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s; }
    .carte:hover .pochette img { transform: scale(1.04); }
    .type {
      position: absolute;
      top: 8px;
      left: 8px;
      font: 500 11px var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 7px;
      border-radius: 4px;
      background: var(--carte);
      color: var(--texte);
    }
    .type.album { background: var(--sticker); color: var(--sticker-texte); }
    .titre { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
    .artistes { color: var(--discret); font-size: 14px; overflow-wrap: anywhere; }

    /* ---------- Messages et pied de page ---------- */
    .message {
      background: var(--carte);
      border: 1.5px dashed var(--trait);
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      color: var(--discret);
    }
    footer { margin-top: 48px; font: 500 12px var(--mono); color: var(--discret); }

    @media (prefers-reduced-motion: reduce) {
      .pochette img { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="sur-titre">Les sorties de tes artistes</div>
      <h1>Radar du <span>vendredi</span></h1>
      <p class="resume" id="resume">Chargement…</p>
    </header>

    <div class="filtres" id="filtres">
      <button type="button" data-type="tout" aria-pressed="true">Tout</button>
      <button type="button" data-type="album" aria-pressed="false">Albums</button>
      <button type="button" data-type="ep" aria-pressed="false">EP</button>
      <button type="button" data-type="single" aria-pressed="false">Singles</button>
    </div>

    <main id="contenu"></main>

    <footer id="pied"></footer>
  </div>

  <script>
    // Noms affichés pour chaque type de sortie renvoyé par Deezer
    const NOMS_TYPES = { album: "Album", ep: "EP", single: "Single", compile: "Compilation" };

    let toutesLesSorties = [];   // rempli quand releases.json est chargé
    let filtreActif = "tout";

    // "2026-10-23" -> objet Date (en heure locale, pour éviter un décalage d'un jour)
    function versDate(texte) {
      const [annee, mois, jour] = texte.split("-").map(Number);
      return new Date(annee, mois - 1, jour);
    }

    const formatJour = new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    const formatCourt = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long" });

    // Petit raccourci pour créer un élément HTML avec une classe et un texte
    function creer(balise, classe, texte) {
      const el = document.createElement(balise);
      if (classe) el.className = classe;
      if (texte !== undefined) el.textContent = texte;   // textContent : le texte n'est jamais interprété comme du HTML
      return el;
    }

    function creerCarte(sortie) {
      const carte = creer("a", "carte");
      carte.href = sortie.lien;
      carte.target = "_blank";
      carte.rel = "noopener";

      const pochette = creer("div", "pochette");
      if (sortie.pochette) {
        const img = document.createElement("img");
        img.src = sortie.pochette;
        img.alt = `Pochette de ${sortie.titre}`;
        img.loading = "lazy";
        pochette.append(img);
      }
      pochette.append(creer("span", `type ${sortie.type}`, NOMS_TYPES[sortie.type] || sortie.type));

      carte.append(pochette, creer("div", "titre", sortie.titre), creer("div", "artistes", sortie.artistes.join(", ")));
      return carte;
    }

    function afficher() {
      const contenu = document.getElementById("contenu");
      contenu.replaceChildren();

      const visibles = toutesLesSorties.filter(s => filtreActif === "tout" || s.type === filtreActif);

      if (visibles.length === 0) {
        const texte = toutesLesSorties.length === 0
          ? "Rien de neuf chez tes artistes cette semaine."
          : "Aucune sortie de ce type cette semaine.";
        contenu.append(creer("div", "message", texte));
        return;
      }

      // Regroupe les sorties par date (elles arrivent déjà triées de la plus récente à la plus ancienne)
      const parJour = new Map();
      for (const sortie of visibles) {
        if (!parJour.has(sortie.date)) parJour.set(sortie.date, []);
        parJour.get(sortie.date).push(sortie);
      }

      for (const [jour, sorties] of parJour) {
        const section = creer("section");
        const titre = creer("h2", null, formatJour.format(versDate(jour)));
        titre.append(creer("span", "compte", `${sorties.length} sortie${sorties.length > 1 ? "s" : ""}`));
        const grille = creer("div", "grille");
        sorties.forEach(s => grille.append(creerCarte(s)));
        section.append(titre, grille);
        contenu.append(section);
      }
    }

    // Clic sur un filtre : on change le filtre actif et on réaffiche
    document.getElementById("filtres").addEventListener("click", (evenement) => {
      const bouton = evenement.target.closest("button");
      if (!bouton) return;
      filtreActif = bouton.dataset.type;
      document.querySelectorAll("#filtres button").forEach(b => b.setAttribute("aria-pressed", b === bouton));
      afficher();
    });

    // Chargement de releases.json, généré par radar.py
    fetch("releases.json", { cache: "no-store" })
      .then(reponse => {
        if (!reponse.ok) throw new Error(`releases.json introuvable (erreur ${reponse.status})`);
        return reponse.json();
      })
      .then(donnees => {
        toutesLesSorties = donnees.sorties;
        const n = toutesLesSorties.length;
        document.getElementById("resume").textContent =
          `Du ${formatCourt.format(versDate(donnees.depuis))} au ${formatCourt.format(versDate(donnees.jusqua))} · ${n} nouveauté${n > 1 ? "s" : ""}`;
        const misAJour = new Date(donnees.genere_le);
        document.getElementById("pied").textContent =
          `Mis à jour le ${misAJour.toLocaleDateString("fr-FR")} à ${misAJour.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}`;
        afficher();
      })
      .catch(erreur => {
        document.getElementById("resume").textContent = "";
        document.getElementById("contenu").replaceChildren(
          creer("div", "message", `Impossible de charger les sorties : ${erreur.message}`)
        );
      });
  </script>
</body>
</html>
